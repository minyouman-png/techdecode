<style>
  :root { --toolbar-h: 46px; }
  body { background: #eceae4; overflow: hidden; }
  .fmtbar {
    position: fixed; top: var(--topbar-h); left: 0; right: 0; height: var(--toolbar-h); z-index: 490;
    display: flex; align-items: center; gap: 6px; padding: 0 10px; overflow-x: auto;
    background: #faf8f4; border-bottom: 1px solid var(--line);
  }
  .fmtbar button {
    appearance: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 7px; padding: 6px 11px; font-size: 13px; cursor: pointer; white-space: nowrap;
  }
  .fmtbar button:hover:not(:disabled) { background: #f1ece1; border-color: var(--gold-soft); }
  .fmtbar button:disabled { opacity: .4; cursor: default; }
  .fmtbar .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; flex: none; }
  .fmtbar .count { font-size: 12px; color: #6c6558; white-space: nowrap; margin-left: auto; padding-left: 10px; }

  #stage {
    position: fixed; top: calc(var(--topbar-h) + var(--toolbar-h)); left: 0; right: 0; bottom: 0;
    overflow: auto; padding: 18px;
  }
  #grid { display: flex; flex-wrap: wrap; gap: 14px; align-content: flex-start; }

  .pg {
    position: relative; width: 150px; background: #fff; border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 8px 6px; box-shadow: 0 1px 3px rgba(0,0,0,.07); cursor: pointer;
    user-select: none;
  }
  .pg.sel { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(184,134,11,.28); }
  .pg .thumbwrap {
    height: 170px; display: flex; align-items: center; justify-content: center; overflow: hidden;
    background: #f6f4ef; border-radius: 4px;
  }
  .pg canvas { max-width: 100%; max-height: 100%; display: block; transition: transform .15s; }
  .pg .lbl { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 11px; color: #6c6558; }
  .pg .lbl .src { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .pg .mark {
    position: absolute; top: 12px; left: 12px; width: 19px; height: 19px; border-radius: 50%;
    background: rgba(255,255,255,.9); border: 1px solid var(--line); display: flex;
    align-items: center; justify-content: center; font-size: 12px; color: transparent;
  }
  .pg.sel .mark { background: var(--gold); border-color: var(--gold); color: #fff; }

  #drop {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; color: #6c6558; text-align: center; padding: 20px;
  }
  #drop h2 { font-family: Georgia, serif; font-weight: 600; margin: 0; color: var(--ink); font-size: 20px; }
  #drop p { margin: 0; font-size: 13px; max-width: 460px; line-height: 1.6; }
  #drop .big { font-size: 42px; }
  body.dragging #stage { background: #f7f1e2; outline: 2px dashed var(--gold-soft); outline-offset: -10px; }

  #busy {
    position: fixed; inset: 0; z-index: 900; display: none; align-items: center; justify-content: center;
    background: rgba(250,248,244,.85); font-size: 14px; color: var(--ink);
  }
  body.busy #busy { display: flex; }
  .privnote {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 480; padding: 5px 12px;
    background: #f4efe2; border-top: 1px solid var(--line); font-size: 11px; color: #6c6558;
  }
  #stage { bottom: 26px; }
</style>
</head>
<body>
<header class="apptop">
  <a class="back" id="backLink" href="/tools/" title="MeNew Docs">←</a>
  <span class="brand">MeNew <em>PDF</em></span>
  <span class="fname" id="fname"></span>
  <span class="spacer"></span>
  <input type="file" id="fileInput" accept="application/pdf,.pdf" multiple hidden>
  <input type="file" id="imgInput" accept="image/png,image/jpeg,.png,.jpg,.jpeg" multiple hidden>
  <button class="btn" id="btnOpen"></button>
  <button class="btn" id="btnImg"></button>
  <button class="btn primary" id="btnSave"></button>
</header>

<div class="fmtbar">
  <button id="btnAll"></button>
  <button id="btnNone"></button>
  <span class="sep"></span>
  <button id="btnLeft" disabled></button>
  <button id="btnRight" disabled></button>
  <button id="btnDel" disabled></button>
  <span class="sep"></span>
  <button id="btnExtract" disabled></button>
  <button id="btnPng" disabled></button>
  <span class="count" id="count"></span>
</div>

<div id="stage">
  <div id="grid"></div>
  <div id="drop">
    <div class="big">📄</div>
    <h2 id="dropTitle"></h2>
    <p id="dropBody"></p>
  </div>
</div>

<div id="busy"><span id="busyText"></span></div>
<div class="privnote" id="privnote"></div>

<script src="../vendor/pdf-lib.min.js"></script>
<script src="../vendor/pdfjs.min.js"></script>
<script src="../vendor/jszip.min.js"></script>
<script src="pdf.js"></script>
</body>
